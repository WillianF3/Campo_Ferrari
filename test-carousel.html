<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="assets/css/photo-gallery.css"><style>body{background:#161513;color:#fff;margin:0;font-family:Arial}section{padding:40px 22px}.container{max-width:1160px;margin:auto}.muted{color:#ccc}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}</style></head><body><section class="cf-photo-teaser"><div class="container"><div class="section-heading"><div><h2> Sua missão. Seu registro.</h2></div><p>Encontre sua foto na galeria</p></div><div class="cf-photo-teaser-carousel" id="cf-photo-carousel" role="region" aria-roledescription="carrossel" aria-label="Fotos dos jogos do Campo Ferrari" tabindex="0"><div class="cf-photo-teaser-viewport"><div class="cf-photo-teaser-track" id="photo-teaser-grid"><p class="muted">Carregando fotos…</p></div></div><div class="cf-photo-teaser-controls" id="cf-photo-teaser-controls" hidden><span class="cf-photo-teaser-hint">FOTOS DOS JOGOS <span class="cf-photo-teaser-hint-dot">•</span> TROCA AUTOMÁTICA</span><div class="cf-photo-teaser-nav"><span class="cf-photo-teaser-indicator" id="cf-photo-teaser-indicator">01 / 01</span><button id="cf-photo-teaser-prev" class="cf-photo-teaser-arrow">←</button><button id="cf-photo-teaser-next" class="cf-photo-teaser-arrow">→</button></div></div></div></div></section><script>const fakePhotos=Array.from({length:15},(_,i)=>({code:`CF-${String(i+1).padStart(3,'0')}`,url:`assets/images/fotos/CF-${String(i+1).padStart(3,'0')}.webp`}));window.fetch=async (url)=>url==='api/photos'?new Response(JSON.stringify(fakePhotos),{status:200,headers:{'Content-Type':'application/json'}}):Promise.reject(new Error('unmocked'));</script><script src="assets/js/photo-gallery.js"></script></body></html>
