<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugestões | Campo Ferrari</title><meta name="description" content="Compartilhe sua experiência e sugestões para melhorar o Campo Ferrari."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="admin/admin.css"><style>main{max-width:660px}article{background:#23211f;border:1px solid #574938;padding:28px;border-radius:14px}form{display:grid;gap:16px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{font-size:13px;color:#c7c0b4}.eyebrow{letter-spacing:.15em;color:#ffa510}@media(max-width:500px){.form-row{grid-template-columns:1fr}}body{background:radial-gradient(ellipse at 80% 0,rgba(255,171,25,.09),transparent 70%),#302b25;color:#fff8ef}
.top{background:#2b251e;border-bottom-color:#80664b}
main article{background:linear-gradient(145deg,#514334,#40372d);border-color:#80664b}
.hint{color:#e4d7c7}main input,main select,main textarea{background:#372e26;border-color:#8f7454;color:#fff8ef}
</style></head><body><header class="top"><a href="./" class="brand">↖ CAMPO <b>FERRARI</b></a><span>SUA OPINIÃO É IMPORTANTE</span></header><main><article><p class="eyebrow">SUGESTÕES E MELHORIAS</p><h1>Conte como foi sua experiência.</h1><p>Seu comentário ajuda a melhorar o campo. O formulário não cria reservas.</p><form id="suggestion-form"><div class="form-row"><label>Nome (opcional)<input type="text" name="name" maxlength="120" autocomplete="name"></label><label>WhatsApp (opcional)<input name="whatsapp" maxlength="40" type="tel" autocomplete="tel"></label></div><label>Avaliação (opcional)<select name="rating"><option value="">Prefiro não avaliar</option><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Regular</option><option value="1">1 — Precisa melhorar</option></select></label><label>Sua sugestão<textarea name="message" rows="5" maxlength="2000" required placeholder="O que gostaria de compartilhar?"></textarea></label><label class="checkbox"><input type="checkbox" required name="consent">Concordo com o tratamento dos dados para analisar minha sugestão, conforme a <a href="politica-de-privacidade.html" style="color:#ffa510">Política de Privacidade</a>.</label><button class="primary">Enviar sugestão →</button></form><p role="status" id="reply" class="alert" hidden></p></article></main><script type="module">
const form=document.querySelector('#suggestion-form'),reply=document.querySelector('#reply');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');if(!form.reportValidity())return;b.disabled=true;reply.hidden=true;const f=new FormData(form);const body={name:f.get('name').trim(),whatsapp:f.get('whatsapp').trim(),message:f.get('message').trim(),rating:f.get('rating')?Number(f.get('rating')):null};try{const resp=await fetch('./api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const r=await resp.json();if(!resp.ok)throw Error(r.detail||'Não foi possível enviar a sugestão.');reply.textContent='Sugestão enviada. Obrigado pela participação!';reply.classList.add('ok');form.reset();}catch(err){reply.textContent=err.message;reply.classList.remove('ok');}finally{reply.hidden=false;b.disabled=false;}});
</script></body></html>
