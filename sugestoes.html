</header><main><article><p class="eyebrow">SUGESTÕES E MELHORIAS</p><h1>Conte como foi sua experiência.</h1><p>Seu comentário ajuda a melhorar o campo. O formulário não cria reservas.</p><form id="suggestion-form"><div class="form-row"><label>Nome (opcional)<input type="text" name="name" maxlength="120" autocomplete="name"></label><label>WhatsApp (opcional)<input name="whatsapp" maxlength="40" type="tel" autocomplete="tel"></label></div><label>Avaliação (opcional)<select name="rating"><option value="">Prefiro não avaliar</option><option value="5">5 — Excelente</option><option value="4">4 — Muito bom</option><option value="3">3 — Bom</option><option value="2">2 — Regular</option><option value="1">1 — Precisa melhorar</option></select></label><label>Sua sugestão<textarea name="message" rows="5" maxlength="2000" required placeholder="O que gostaria de compartilhar?"></textarea></label><label class="checkbox"><input type="checkbox" required name="consent">Concordo com o tratamento dos dados para analisar minha sugestão, conforme a <a href="politica-de-privacidade.html" style="color:#ffa510">Política de Privacidade</a>.</label><button class="primary">Enviar sugestão →</button></form><p role="status" id="reply" class="alert" hidden></p></article></main><script type="module">
const form=document.querySelector('#suggestion-form'),reply=document.querySelector('#reply');form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');if(!form.reportValidity())return;b.disabled=true;reply.hidden=true;const f=new FormData(form);const body={name:f.get('name').trim(),whatsapp:f.get('whatsapp').trim(),message:f.get('message').trim(),rating:f.get('rating')?Number(f.get('rating')):null};try{const resp=await fetch('./api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const r=await resp.json();if(!resp.ok)throw Error(r.detail||'Não foi possível enviar a sugestão.');reply.textContent='Sugestão enviada. Obrigado pela participação!';reply.classList.add('ok');form.reset();}catch(err){reply.textContent=err.message;reply.classList.remove('ok');}finally{reply.hidden=false;b.disabled=false;}});
</script><script src="/assets/js/header-unificado-20261031.js?v=20261031-1" defer></script>
